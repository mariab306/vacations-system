services:
  backend:
    build: ./backend
    container_name: vacations-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: vacations-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped